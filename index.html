<style>

<body>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  #ecko-root, .ecko-root {
    --bg: #090d13;
    --panel: #101826;
    --panel-2: #0d1420;
    --line: #1c2836;
    --cyan: #52d8ff;
    --cyan-dim: #2a6478;
    --amber: #ffb454;
    --text: #d7e2ef;
    --muted: #64758a;

    background: radial-gradient(ellipse at 50% -10%, #10202c 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    width: 100%;
    min-height: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  #ecko-root *, .ecko-root * { box-sizing: border-box; }

  @keyframes ecko-flash { 0% { opacity: 0.55; } 100% { opacity: 0; } }
  #ecko-root::before, .ecko-root::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(82,216,255,0.35), transparent 60%);
    pointer-events: none;
    z-index: 5;
    animation: ecko-flash 900ms ease-out forwards;
  }

  @keyframes ecko-scan { 0% { top: -5%; opacity: 0.9; } 100% { top: 105%; opacity: 0; } }
  #ecko-root::after, .ecko-root::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    box-shadow: 0 0 12px var(--cyan);
    pointer-events: none;
    z-index: 6;
    animation: ecko-scan 1100ms ease-out forwards;
  }

  .ecko-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 10px;
    border-bottom: 1px solid var(--line);
  }
  @keyframes ecko-brand-in {
    0% { opacity: 0; letter-spacing: 14px; transform: scale(0.92); }
    100% { opacity: 1; letter-spacing: 6px; transform: scale(1); }
  }
  .ecko-brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--text);
    animation: ecko-brand-in 700ms cubic-bezier(.2,.8,.2,1) both;
  }
  .ecko-brand span { color: var(--cyan); }
  .ecko-status {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ecko-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    transition: background .3s, box-shadow .3s;
  }
  .ecko-dot.active {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
    animation: pulse-dot 1.1s ease-in-out infinite;
  }
  .ecko-dot.armed {
    background: var(--cyan-dim);
    box-shadow: 0 0 6px var(--cyan-dim);
    animation: pulse-dot 2.6s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

  .ecko-btn.wake-on {
    color: var(--bg);
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(82,216,255,.5);

  .ecko-mem-badge {
    color: var(--amber);
    margin-right: 2px;

  .ecko-lock-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 0 0 0 8px;
    margin: -4px 0;
    cursor: pointer;
    display: flex;
    align-items: center;

  .ecko-lock-btn svg { width: 14px; height: 14px; }
  .ecko-lock-btn:hover { color: var(--cyan); }

  .lockscreen {
    align-items: center;
    justify-content: center;

  .lock-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    padding: 24px;

  .lock-brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 8px;
    color: var(--text);
    margin-bottom: 4px;

  .lock-brand span { color: var(--cyan); }
  .lock-sub {

    letter-spacing: 2px;

  @keyframes spin { to { transform: rotate(360deg); } }

  .ecko-core-glow {

    font-size: 11px;

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// --- Storage (standalone version — uses the browser's own localStorage) ---
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  }
};

// --- Password lock ---
async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function LockScreen({ mode, onSubmit, error }) {
  const [pw, setPw] = useState('');
  const [confirm, setConfirm] = useState('');
  const [localError, setLocalError] = useState('');

  const submit = () => {
    if (mode === 'create') {
      if (pw.length < 4) { setLocalError('Use at least 4 characters.'); return; }
      if (pw !== confirm) { setLocalError("Passwords don't match."); return; }
      setLocalError('');
      onSubmit(pw);
    } else {
      onSubmit(pw);
    }
  };

  return (
    <div className="ecko-root lockscreen">
      <div className="lock-center">
        <div className="lock-brand">E<span>C</span>KO</div>
        <div className="lock-sub">{mode === 'create' ? 'CREATE A PASSWORD' : 'LOCKED — ENTER PASSWORD'}</div>
        <input
          type="password"
          className="lock-input"
          value={pw}
          placeholder="Password"
          autoFocus
          onChange={e => setPw(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && mode !== 'create') submit(); }}
        />
        {mode === 'create' && (
          <input
            type="password"
            className="lock-input"
            value={confirm}
            placeholder="Confirm password"
            onChange={e => setConfirm(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') submit(); }}
          />
        )}
        {(localError || error) && <div className="lock-error">{localError || error}</div>}
        <button className="lock-btn" onClick={submit}>{mode === 'create' ? 'Set Password' : 'Unlock'}</button>
      </div>
    </div>
  );
}

function App() {
  const [status, setStatus] = useState('loading'); // loading | create | locked | unlocked
  const [error, setError] = useState('');

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get('ecko-password-hash');
        setStatus(res && res.value ? 'locked' : 'create');
      } catch {
        setStatus('create');
      }
    })();
  }, []);

  const handleCreate = async (pw) => {
    const hash = await sha256(pw);
    try { await storage.set('ecko-password-hash', hash); } catch {}
    setStatus('unlocked');
  };

  const handleUnlock = async (pw) => {
    try {
      const hash = await sha256(pw);
      const res = await storage.get('ecko-password-hash');
      if (res && res.value === hash) {
        setError('');
        setStatus('unlocked');
      } else {
        setError('Incorrect password.');
      }
    } catch {
      setError('Could not verify — try again.');
    }
  };

  if (status === 'loading') return null;
  if (status === 'create') return <LockScreen mode="create" onSubmit={handleCreate} />;
  if (status === 'locked') return <LockScreen mode="unlock" onSubmit={handleUnlock} error={error} />;
  return <Ecko onLock={() => setStatus('locked')} />;
}

function CoreVisualizer() {
  return (
    <div className="ecko-core">
      <svg viewBox="0 0 100 100">
        <g className="ecko-ring-outer">

// Ecko's local "skills" — handled instantly, without calling the AI.
// Each returns null if it doesn't match, or a reply string if it does.

function trySkillTime(text) {
  if (!/\b(what('?s| is) the time|current time|what time is it)\b/i.test(text)) return null;
  const now = new Date();
  const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  const date = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  return `It's ${time}, on ${date}.`;
}

function trySkillMath(text) {
  const m = text.match(/(?:calculate|what('?s| is))\s+(.+)/i);
  const expr = m ? m[2] : text;
  // Only treat it as math if it actually looks like an expression
  if (!/^[\s\d.,+\-*/^()%a-z\s]+$/i.test(expr)) return null;
  if (!/[\d]/.test(expr) || !/[+\-*/^%]/.test(expr)) return null;
  try {
    const cleaned = expr.replace(/[?]/g, '').trim();
    const result = math.evaluate(cleaned);
    if (typeof result !== 'number' || Number.isNaN(result)) return null;
    return `${cleaned.trim()} = ${result}`;
  } catch {
    return null;
  }
}

async function trySkillWeather(text) {
  const m = text.match(/weather (?:in|at|for)\s+([a-zA-Z\s]+)/i);
  if (!m) return null;
  const city = m[1].trim();
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
    const geo = await geoRes.json();
    if (!geo.results || !geo.results.length) return { reply: `I couldn't find a place called ${city}.` };
    const { latitude, longitude, name, country } = geo.results[0];
    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
    const w = await wRes.json();
    const cw = w.current_weather;
    if (!cw) return { reply: `Couldn't get weather data for ${name}.` };
    return {
      reply: `${name}, ${country}: ${cw.temperature}°C, wind ${cw.windspeed} km/h.`,
      weather: { lat: latitude, lon: longitude, name, country }
    };
  } catch {
    return { reply: `Weather lookup failed — connection issue.` };
  }
}

// --- Location / maps skills (free OpenStreetMap Nominatim geocoder — no API key needed) ---
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function geocode(place) {
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(place)}`);
  const data = await res.json();
  return data && data.length ? data[0] : null;
}

async function trySkillDistanceBetween(text) {
  const m = text.match(/(?:distance between|how far is)\s+(.+?)\s+(?:and|from)\s+(.+?)\??$/i);
  if (!m) return null;
  try {
    const [a, b] = await Promise.all([geocode(m[1].trim()), geocode(m[2].trim())]);
    if (!a || !b) return { reply: "I couldn't find one of those places." };
    const km = haversineKm(parseFloat(a.lat), parseFloat(a.lon), parseFloat(b.lat), parseFloat(b.lon));
    return { reply: `${a.display_name.split(',')[0]} to ${b.display_name.split(',')[0]} is about ${Math.round(km)} km, straight-line.` };
  } catch {
    return { reply: "Distance lookup failed — connection issue." };
  }
}

function trySkillDistanceFromMe(text) {
  const m = text.match(/how far am i from\s+(.+?)\??$/i);
  if (!m) return null;
  const place = m[1].trim();
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve({ reply: "I can't access location on this device." }); return; }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        const loc = await geocode(place);
        if (!loc) { resolve({ reply: `I couldn't find ${place}.` }); return; }
        const km = haversineKm(pos.coords.latitude, pos.coords.longitude, parseFloat(loc.lat), parseFloat(loc.lon));
        resolve({
          reply: `You're about ${Math.round(km)} km from ${loc.display_name.split(',')[0]}.`,
          map: { lat: parseFloat(loc.lat), lon: parseFloat(loc.lon) }
        });
      } catch {
        resolve({ reply: "Location lookup failed — connection issue." });
      }
    }, () => resolve({ reply: "I need location permission to answer that." }));
  });
}

async function trySkillWhereIs(text) {
  const m =
    text.match(/where(?:'s| is| are)\s+(?:the\s+)?(.+?)\??$/i) ||
    text.match(/(?:^|show me\s+)(?:a\s+)?map of\s+(.+?)\??$/i);
  if (!m) return null;
  const place = m[1].trim();
  if (!place) return null;
  try {
    const loc = await geocode(place);
    if (!loc) return { reply: `I couldn't find a place called ${place}.` };
    return {
      reply: `${loc.display_name}.`,
      map: { lat: parseFloat(loc.lat), lon: parseFloat(loc.lon) }
    };
  } catch {
    return { reply: "Location lookup failed — connection issue." };
  }
}

// --- Picture skill (Wikipedia/Wikimedia — free, keyless, real existing web images) ---
async function trySkillPicture(text) {
  const m = text.match(/(?:show me\s+)?(?:a |an |the )?(?:picture|photo|image)s?\s+of\s+(.+?)\??$/i);
  if (!m) return null;
  const query = m[1].trim();
  if (!query) return null;
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages&piprop=original&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const pages = data.query && data.query.pages;
    if (!pages) return { reply: `I couldn't find a picture of ${query}.` };
    const page = Object.values(pages)[0];
    if (!page || !page.original) return { reply: `I found "${page ? page.title : query}" but there's no picture for it.` };
    return {
      reply: `Here's ${page.title}.`,
      photo: { url: page.original.source, title: page.title }
    };
  } catch {
    return { reply: "Picture lookup failed — connection issue." };
  }
}

// --- Currency & unit converter ---
const CURRENCY_MAP = {
  dollar: 'USD', dollars: 'USD', usd: 'USD',
  euro: 'EUR', euros: 'EUR', eur: 'EUR',
  pound: 'GBP', pounds: 'GBP', gbp: 'GBP',
  yen: 'JPY', jpy: 'JPY',
  cad: 'CAD', aud: 'AUD',
  franc: 'CHF', francs: 'CHF', chf: 'CHF',
  yuan: 'CNY', renminbi: 'CNY', cny: 'CNY',
  rupee: 'INR', rupees: 'INR', inr: 'INR',
  krona: 'SEK', kronor: 'SEK', sek: 'SEK',
};
const UNIT_ALIASES = {
  celsius: 'degC', centigrade: 'degC',
  fahrenheit: 'degF',
  kelvin: 'degK',
  mile: 'mi', miles: 'mi',
  kilometer: 'km', kilometers: 'km', kilometre: 'km', kilometres: 'km',
  meter: 'm', meters: 'm', metre: 'm', metres: 'm',
  centimeter: 'cm', centimeters: 'cm',
  foot: 'ft', feet: 'ft',
  inch: 'in', inches: 'in',
  yard: 'yd', yards: 'yd',
  pound: 'lb', pounds: 'lb', lbs: 'lb',
  kilogram: 'kg', kilograms: 'kg', kilo: 'kg', kilos: 'kg',
  gram: 'g', grams: 'g',
  ounce: 'oz', ounces: 'oz',
  liter: 'L', liters: 'L', litre: 'L', litres: 'L',
  gallon: 'gal', gallons: 'gal',
  cup: 'cup', cups: 'cup',
};

async function trySkillConvert(text) {
  const m = text.match(/(?:convert\s+)?(-?\d+(?:\.\d+)?)\s*([a-zA-Z]+)\s+(?:to|in)\s+([a-zA-Z]+)\??$/i);
  if (!m) return null;
  const amount = parseFloat(m[1]);
  const fromRaw = m[2].toLowerCase();
  const toRaw = m[3].toLowerCase();

  const fromCur = CURRENCY_MAP[fromRaw];
  const toCur = CURRENCY_MAP[toRaw];
  if (fromCur && toCur) {
    try {
      const res = await fetch(`https://api.frankfurter.app/latest?amount=${amount}&from=${fromCur}&to=${toCur}`);
      const data = await res.json();
      const converted = data.rates && data.rates[toCur];
      if (converted == null) return { reply: "I couldn't get that exchange rate." };
      return { reply: `${amount} ${fromCur} is about ${converted.toFixed(2)} ${toCur}.` };
    } catch {
      return { reply: "Currency lookup failed — connection issue." };
    }
  }

  try {
    const fromUnit = UNIT_ALIASES[fromRaw] || fromRaw;
    const toUnit = UNIT_ALIASES[toRaw] || toRaw;
    const result = math.evaluate(`${amount} ${fromUnit} to ${toUnit}`);
    return { reply: `${amount} ${fromRaw} is about ${result.toString()}.` };
  } catch {
    return null; // not a recognized conversion — let other skills / the AI handle it
  }
}

// Tries each skill in order. Returns { reply, map?, photo? } if one handled it, else null.
async function runSkills(text) {
  const time = trySkillTime(text);
  if (time) return { reply: time };
  const weather = await trySkillWeather(text);
  if (weather) return weather;
  const distFromMe = await trySkillDistanceFromMe(text);
  if (distFromMe) return distFromMe;
  const distBetween = await trySkillDistanceBetween(text);
  if (distBetween) return distBetween;
  const convert = await trySkillConvert(text);
  if (convert) return convert;
  const picture = await trySkillPicture(text);
  if (picture) return picture;
  const whereIs = await trySkillWhereIs(text);
  if (whereIs) return whereIs;
  const mathResult = trySkillMath(text);
  if (mathResult) return { reply: mathResult };
  return null;
}

// --- Memory pattern helpers (logic lives in the component, since they touch stored state) ---
function matchName(text) {

  return m ? m[1] : null;
}
function matchRemember(text) {
  const m = text.match(/^(?:please\s+)?remember\s+(?:that\s+)?(.+)/i);
  return m ? m[1].trim().replace(/[.?!]+$/, '') : null;
}
function isRecallRequest(text) {
  return /\b(what do you (remember|know) about me|what have you remembered)\b/i.test(text);
}
function isForgetRequest(text) {

}

// --- To-do list ---
function matchAddTodo(text) {
  const m = text.match(/^add\s+(.+?)\s+to\s+(?:my\s+)?(?:to-?do\s+)?list\.?$/i) ||
    text.match(/^add task\s+(.+?)\.?$/i);
  return m ? m[1].trim() : null;
}
function isListTodosRequest(text) {
  return /\b(what'?s on my (?:to-?do )?list|show my (?:to-?do )?list|list my (?:to-?do )?tasks|read my (?:to-?do )?list)\b/i.test(text);
}
function matchCompleteTodo(text) {
  const m = text.match(/^(?:mark|complete|finish(?:ed)?|check off)\s+(.+?)(?:\s+as done|\s+off)?\.?$/i) ||
    text.match(/^i(?:'ve| have)? finished\s+(.+?)\.?$/i);
  return m ? m[1].trim() : null;
}
function matchDeleteTodo(text) {
  const m = text.match(/^(?:remove|delete)\s+(.+?)\s+from (?:my )?(?:to-?do )?list\.?$/i);
  return m ? m[1].trim() : null;
}
function isClearTodosRequest(text) {
  return /\b(clear my (?:to-?do )?list|clear (?:my )?completed tasks|delete my (?:to-?do )?list)\b/i.test(text);
}

// --- Timers & reminders ---
function parseDurationMs(text) {
  let total = 0;
  let matched = false;
  const re = /(\d+|a|an)\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)/gi;
  let m;
  while ((m = re.exec(text))) {
    matched = true;
    let n = m[1].toLowerCase();
    n = (n === 'a' || n === 'an') ? 1 : parseInt(n, 10);
    const unit = m[2].toLowerCase();
    if (unit.startsWith('hour') || unit.startsWith('hr')) total += n * 3600000;
    else if (unit.startsWith('min')) total += n * 60000;
    else if (unit.startsWith('sec')) total += n * 1000;
  }
  return matched && total > 0 ? total : null;
}

function parseAbsoluteMs(text) {
  const m = text.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if (!m) return null;
  let hour = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  const ampm = m[3].toLowerCase();
  if (ampm === 'pm' && hour < 12) hour += 12;
  if (ampm === 'am' && hour === 12) hour = 0;
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, min, 0, 0);
  if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
  return target.getTime() - now.getTime();
}

function matchTimerRequest(text) {
  const m = text.match(/^(?:set |start )?(?:a |an )?timer(?: for)?\s+(.+?)\??$/i);
  if (!m) return null;
  const ms = parseDurationMs(m[1]);
  if (!ms) return null;
  return { label: 'Timer', ms };
}

function matchReminderRequest(text) {
  const m = text.match(/^remind me to\s+(.+?)\s+(in|at)\s+(.+?)\??$/i);
  if (!m) return null;
  const task = m[1].trim();
  const mode = m[2].toLowerCase();
  const rest = m[3].trim();
  const ms = mode === 'in' ? parseDurationMs(rest) : parseAbsoluteMs(rest);
  if (!ms) return null;
  return { label: task, ms };
}

function isListTimersRequest(text) {
  return /\b(what timers|list (?:my )?timers|do i have any timers|what reminders|list (?:my )?reminders)\b/i.test(text);
}

function isCancelTimersRequest(text) {
  return /\b(cancel (?:my |the )?(?:timer|reminder)s?|clear (?:my |the )?(?:timer|reminder)s?)\b/i.test(text);
}

function formatRemaining(ms) {
  if (ms == null || ms < 0) ms = 0;
  const totalSec = Math.ceil(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const tone = (freq, delay) => {
      setTimeout(() => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        o.start();
        o.stop(ctx.currentTime + 0.55);
      }, delay);
    };
    tone(880, 0);
    tone(1046, 300);
  } catch {}
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function timeGreeting() {
  const h = new Date().getHours();
  if (h < 5) return "Still up at this hour";
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";

}

function bootGreeting(name) {

// --- Voice engine ---
// Browsers load their voice list asynchronously, and the default fallback voice
// (eSpeak-style) is what makes speech sound flat/robotic. Warm the list early,
// and prefer higher-quality "natural"/"neural" voices when the OS/browser has them.
if (typeof window !== 'undefined' && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// A manually chosen voice overrides the automatic pick, since "best guess" varies
// wildly by device and the user's ear is the real judge.
let selectedVoiceURI = null;
function setEckoVoice(uri) { selectedVoiceURI = uri; }

function pickBestVoice() {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  if (selectedVoiceURI) {
    const chosen = voices.find(v => v.voiceURI === selectedVoiceURI);
    if (chosen) return chosen;
  }
  const score = (v) => {
    const n = v.name.toLowerCase();
    if (/natural|neural|enhanced|premium/.test(n)) return 0;
    if (/google uk english male|google us english|daniel|guy|ryan/.test(n)) return 1;
    if (/male/.test(n)) return 2;
    if (v.lang && v.lang.startsWith('en')) return 3;
    return 4;
  };
  return [...voices].sort((a, b) => score(a) - score(b))[0] || null;
}

// Speaks sentence-by-sentence (separate utterances) so there's a natural micro-pause
// between sentences instead of one flat run-on line, with slight per-sentence variance
// in rate/pitch so it doesn't sound like a metronome.
function speakEcko(text) {
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const voice = pickBestVoice();
  const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
  sentences.forEach((s) => {
    const clean = s.trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 0.96 + Math.random() * 0.07;
    u.pitch = 0.84 + Math.random() * 0.05;
    u.volume = 1;
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  });
}

const STICKERS = ['⭐','🔥','❤️','😎','✨','🚀','⚡','🏆','💯','🎮','⚽','🎧'];
const DEFAULT_FILTERS = { grayscale: 0, sepia: 0, invert: 0, brightness: 100, contrast: 100, saturate: 100, blur: 0 };
const PRESETS = {
  'None': DEFAULT_FILTERS,
  'B&W': { ...DEFAULT_FILTERS, grayscale: 100, contrast: 110 },
  'Vintage': { ...DEFAULT_FILTERS, sepia: 60, contrast: 95, saturate: 85 },
  'Vivid': { ...DEFAULT_FILTERS, saturate: 160, contrast: 115 },
  'Cool': { ...DEFAULT_FILTERS, saturate: 110, brightness: 105, contrast: 105 },
  'Invert': { ...DEFAULT_FILTERS, invert: 100 },
};

function filterCss(f) {
  return `grayscale(${f.grayscale}%) sepia(${f.sepia}%) invert(${f.invert}%) brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%) blur(${f.blur}px)`;
}

function PhotoLab({ onClose }) {
  const canvasRef = useRef(null);
  const fileInputRef = useRef(null);
  const imageRef = useRef(null);
  const dragRef = useRef(null);
  const [hasImage, setHasImage] = useState(false);
  const [filters, setFilters] = useState(DEFAULT_FILTERS);
  const [overlays, setOverlays] = useState([]);
  const [textInput, setTextInput] = useState('');
  const [textColor, setTextColor] = useState('#52d8ff');

  const redraw = useCallback(() => {
    const canvas = canvasRef.current;
    const img = imageRef.current;
    if (!canvas || !img) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.filter = filterCss(filters);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.filter = 'none';
    overlays.forEach(o => {
      if (o.type === 'text') {
        ctx.font = `bold ${o.size}px sans-serif`;
        ctx.fillStyle = o.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 3;
        ctx.strokeText(o.text, o.x, o.y);
        ctx.fillText(o.text, o.x, o.y);
      } else if (o.type === 'sticker') {
        ctx.font = `${o.size}px sans-serif`;
        ctx.fillText(o.emoji, o.x, o.y);
      }
    });
  }, [filters, overlays]);

  useEffect(() => { redraw(); }, [redraw]);

  const loadFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = canvasRef.current;
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        imageRef.current = img;
        setFilters(DEFAULT_FILTERS);
        setOverlays([]);
        setHasImage(true);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const applyPreset = (name) => setFilters(PRESETS[name]);

  const addText = () => {
    if (!textInput.trim() || !canvasRef.current) return;
    const c = canvasRef.current;
    setOverlays(o => [...o, {
      id: Date.now(), type: 'text', text: textInput.trim(),
      x: c.width / 2, y: c.height / 2, size: Math.max(18, Math.round(c.width / 14)), color: textColor
    }]);
    setTextInput('');
  };

  const addSticker = (emoji) => {
    const c = canvasRef.current;
    if (!c) return;
    setOverlays(o => [...o, {
      id: Date.now() + Math.random(), type: 'sticker', emoji,
      x: c.width / 2, y: c.height / 2, size: Math.round(c.width / 8)
    }]);
  };

  const undoOverlay = () => setOverlays(o => o.slice(0, -1));

  const cropToAspect = (ratio) => {
    const img = imageRef.current;
    const c = canvasRef.current;
    if (!img || !c) return;
    let cw = c.width, ch = c.height;
    let targetW = cw, targetH = cw / ratio;
    if (targetH > ch) { targetH = ch; targetW = ch * ratio; }
    const offX = (cw - targetW) / 2, offY = (ch - targetH) / 2;
    const temp = document.createElement('canvas');
    temp.width = targetW; temp.height = targetH;
    const tctx = temp.getContext('2d');
    tctx.filter = filterCss(filters);
    // draw the portion of the original image corresponding to the crop window
    const sx = (offX / cw) * img.width, sy = (offY / ch) * img.height;
    const sw = (targetW / cw) * img.width, sh = (targetH / ch) * img.height;
    tctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
    const newImg = new Image();
    newImg.onload = () => {
      imageRef.current = newImg;
      c.width = targetW; c.height = targetH;
      setFilters(DEFAULT_FILTERS);
      setOverlays([]);
    };
    newImg.src = temp.toDataURL();
  };

  const pointerPos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const scaleX = canvasRef.current.width / rect.width;
    const scaleY = canvasRef.current.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  };

  const onPointerDown = (e) => {
    const p = pointerPos(e);
    for (let i = overlays.length - 1; i >= 0; i--) {
      const o = overlays[i];
      const half = o.size;
      if (Math.abs(p.x - o.x) < half && Math.abs(p.y - o.y) < half) {
        dragRef.current = { id: o.id, offX: p.x - o.x, offY: p.y - o.y };
        break;
      }
    }
  };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    const p = pointerPos(e);
    setOverlays(list => list.map(o => o.id === dragRef.current.id
      ? { ...o, x: p.x - dragRef.current.offX, y: p.y - dragRef.current.offY }
      : o));
  };
  const onPointerUp = () => { dragRef.current = null; };

  const download = () => {
    const canvas = canvasRef.current;
    const link = document.createElement('a');
    link.download = 'ecko-photo.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  const filterRow = (label, key, min, max) => (
    <div className="pl-slider-row">
      <span>{label}</span>
      <input type="range" min={min} max={max} value={filters[key]}
        onChange={e => setFilters(f => ({ ...f, [key]: Number(e.target.value) }))} />
    </div>
  );

  return (
    <div className="ecko-root photolab">
      <div className="ecko-header">
        <div className="ecko-brand">PHOTO <span>LAB</span></div>
        <button className="ecko-btn" onClick={onClose} title="Back to Ecko">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div className="pl-body">
        {!hasImage ? (
          <div className="pl-upload" onClick={() => fileInputRef.current.click()}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" width="36" height="36"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Tap to upload a photo</span>
          </div>
        ) : (
          <>
            <canvas
              ref={canvasRef}
              className="pl-canvas"
              onMouseDown={onPointerDown} onMouseMove={onPointerMove} onMouseUp={onPointerUp} onMouseLeave={onPointerUp}
              onTouchStart={onPointerDown} onTouchMove={onPointerMove} onTouchEnd={onPointerUp}
            />

            <div className="pl-section">
              <div className="pl-label">PRESETS</div>
              <div className="pl-row wrap">
                {Object.keys(PRESETS).map(name => (
                  <button key={name} className="pl-chip" onClick={() => applyPreset(name)}>{name}</button>
                ))}
              </div>
            </div>

            <div className="pl-section">
              <div className="pl-label">ADJUST</div>
              {filterRow('Brightness', 'brightness', 0, 200)}
              {filterRow('Contrast', 'contrast', 0, 200)}
              {filterRow('Saturate', 'saturate', 0, 200)}
              {filterRow('Blur', 'blur', 0, 10)}
            </div>

            <div className="pl-section">
              <div className="pl-label">TEXT</div>
              <div className="pl-row">
                <input className="pl-text-input" value={textInput} placeholder="Add a caption..."
                  onChange={e => setTextInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addText(); }} />
                <input className="pl-color" type="color" value={textColor} onChange={e => setTextColor(e.target.value)} />
                <button className="pl-chip" onClick={addText}>Add</button>
              </div>
            </div>

            <div className="pl-section">
              <div className="pl-label">STICKERS</div>
              <div className="pl-row wrap">
                {STICKERS.map(s => (
                  <button key={s} className="pl-sticker" onClick={() => addSticker(s)}>{s}</button>
                ))}
              </div>
            </div>

            <div className="pl-section">
              <div className="pl-label">CROP</div>
              <div className="pl-row wrap">
                <button className="pl-chip" onClick={() => cropToAspect(1)}>Square</button>
                <button className="pl-chip" onClick={() => cropToAspect(4 / 5)}>Portrait</button>
                <button className="pl-chip" onClick={() => cropToAspect(16 / 9)}>Wide</button>
              </div>
              <div className="pl-hint">Crop first, then add text/stickers for best results — drag them to reposition.</div>
            </div>

            <div className="pl-section pl-actions">
              <button className="pl-chip" onClick={undoOverlay} disabled={!overlays.length}>Undo</button>
              <button className="pl-chip" onClick={() => fileInputRef.current.click()}>New Photo</button>
              <button className="pl-chip primary" onClick={download}>Download</button>
            </div>
          </>
        )}
        <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }}
          onChange={e => loadFile(e.target.files[0])} />
      </div>
    </div>
  );
}

function TodoPanel({ todos, onAdd, onToggle, onDelete, onClearDone, onClose }) {
  const [text, setText] = useState('');
  const add = () => {
    if (!text.trim()) return;
    onAdd(text.trim());
    setText('');
  };
  const pending = todos.filter(t => !t.done);
  const done = todos.filter(t => t.done);

  return (
    <div className="ecko-root todopanel">
      <div className="ecko-header">
        <div className="ecko-brand">TO-<span>DO</span></div>
        <button className="ecko-btn" onClick={onClose} title="Back to Ecko">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div className="pl-body">
        <div className="pl-row" style={{ width: '100%', maxWidth: 460 }}>
          <input
            className="pl-text-input"
            value={text}
            placeholder="Add a task..."
            onChange={e => setText(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') add(); }}
          />
          <button className="pl-chip primary" onClick={add}>Add</button>
        </div>

        <div className="pl-section" style={{ width: '100%', maxWidth: 460 }}>
          <div className="pl-label">TASKS ({pending.length})</div>
          {pending.length === 0 && <div className="pl-hint">Nothing on your list yet.</div>}
          {pending.map(t => (
            <div key={t.id} className="todo-item">
              <button className="todo-check" onClick={() => onToggle(t.id)} aria-label="Mark done" />
              <span className="todo-text">{t.text}</span>
              <button className="todo-del" onClick={() => onDelete(t.id)} aria-label="Delete">×</button>
            </div>
          ))}
        </div>

        {done.length > 0 && (
          <div className="pl-section" style={{ width: '100%', maxWidth: 460 }}>
            <div className="pl-label">DONE ({done.length})</div>
            {done.map(t => (
              <div key={t.id} className="todo-item done">
                <button className="todo-check checked" onClick={() => onToggle(t.id)} aria-label="Mark not done">✓</button>
                <span className="todo-text">{t.text}</span>
                <button className="todo-del" onClick={() => onDelete(t.id)} aria-label="Delete">×</button>
              </div>
            ))}
            <button className="pl-chip" onClick={onClearDone} style={{ marginTop: 8 }}>Clear completed</button>
          </div>
        )}
      </div>
    </div>
  );
}

function Ecko({ onLock }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [listening, setListening] = useState(false);
  const [voiceOn, setVoiceOn] = useState(true);
  const [booting, setBooting] = useState(true);
  const [memory, setMemory] = useState({ name: null, facts: [] });
  const memoryRef = useRef(memory);
  const [voiceList, setVoiceList] = useState([]);
  const [voiceURI, setVoiceURI] = useState('');
  const [photoMode, setPhotoMode] = useState(false);
  const [auddToken, setAuddToken] = useState('');
  const [auddInput, setAuddInput] = useState('');
  const [songRecording, setSongRecording] = useState(false);
  const [songBusy, setSongBusy] = useState(false);
  const [timers, setTimers] = useState([]);
  const [todos, setTodos] = useState([]);
  const [todoMode, setTodoMode] = useState(false);
  const [liveClock, setLiveClock] = useState(new Date());
  const [liveWeather, setLiveWeather] = useState(null); // { name, country, lat, lon, temp, wind, updatedAt }
  const weatherIntervalRef = useRef(null);
  const logRef = useRef(null);
  const recognitionRef = useRef(null);
  const rootRef = useRef(null);

  useEffect(() => { memoryRef.current = memory; }, [memory]);

  // Boot sequence: load persistent memory, then reveal a short status log before greeting.
  useEffect(() => {
    (async () => {
      let mem = { name: null, facts: [] };
      try {
        const res = await storage.get('ecko-memory');
        if (res && res.value) mem = JSON.parse(res.value);
      } catch {
        // no stored memory yet — that's fine, defaults stand
      }
      setMemory(mem);
      memoryRef.current = mem;

      const bootLines = [
        "INITIALIZING ECKO...",
        "CORE SYSTEMS ONLINE",
        "VOICE MODULE: READY",
        (mem.name || mem.facts.length) ? "MEMORY LINK: RESTORED" : "MEMORY LINK: NEW PROFILE",
      ];
      for (const line of bootLines) {
        setMessages(m => [...m, { role: 'system', text: line }]);
        await sleep(340);
      }
      await sleep(200);
      const greeting = bootGreeting(mem.name);
      setMessages(m => [...m, { role: 'bot', text: greeting }]);
      setBooting(false);
      speakEcko(greeting);
    })();
  }, []);

  // Load the list of voices this browser actually has, and any saved preference
  useEffect(() => {
    const loadVoices = () => {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      const english = voices.filter(v => v.lang && v.lang.startsWith('en'));
      setVoiceList(english.length ? english : voices);
    };
    loadVoices();
    if (window.speechSynthesis) window.speechSynthesis.addEventListener('voiceschanged', loadVoices);

    (async () => {
      try {
        const res = await storage.get('ecko-voice');
        if (res && res.value) {
          setVoiceURI(res.value);
          setEckoVoice(res.value);
        }
      } catch {
        // no saved preference yet
      }
    })();

    return () => {
      if (window.speechSynthesis) window.speechSynthesis.removeEventListener('voiceschanged', loadVoices);
    };
  }, []);

  const chooseVoice = useCallback(async (uri) => {
    setVoiceURI(uri);
    setEckoVoice(uri);
    try { await storage.set('ecko-voice', uri); } catch {}
  }, []);

  // Load a saved AudD token, if the user has already set one up
  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get('ecko-audd-token');
        if (res && res.value) setAuddToken(res.value);
      } catch {
        // no token saved yet
      }
    })();
  }, []);

  const saveAuddToken = useCallback(async () => {
    const token = auddInput.trim();
    if (!token) return;
    setAuddToken(token);
    setAuddInput('');
    try { await storage.set('ecko-audd-token', token); } catch {}
  }, [auddInput]);

  // Live clock — ticks on its own, no need to ask "what time is it" again
  useEffect(() => {
    const t = setInterval(() => setLiveClock(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  // Timers & reminders — load any that were still running, drop ones already past
  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get('ecko-timers');
        if (res && res.value) {
          const list = JSON.parse(res.value).filter(t => t.endTime > Date.now());
          setTimers(list);
        }
      } catch {
        // none saved yet
      }
    })();
  }, []);

  const persistTimers = useCallback(async (list) => {
    try {
      await storage.set('ecko-timers', JSON.stringify(list));
    } catch {
      // persistence failed silently — timer still runs this session
    }
  }, []);

  // To-do list — load, persist, and CRUD
  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get('ecko-todos');
        if (res && res.value) setTodos(JSON.parse(res.value));
      } catch {
        // none saved yet
      }
    })();
  }, []);

  const persistTodos = useCallback(async (list) => {
    try {
      await storage.set('ecko-todos', JSON.stringify(list));
    } catch {
      // persistence failed silently
    }
  }, []);

  const addTodo = useCallback((text) => {
    setTodos(prev => {
      const next = [...prev, { id: Date.now() + Math.random(), text, done: false }];
      persistTodos(next);
      return next;
    });
  }, [persistTodos]);

  const toggleTodo = useCallback((id) => {
    setTodos(prev => {
      const next = prev.map(t => t.id === id ? { ...t, done: !t.done } : t);
      persistTodos(next);
      return next;
    });
  }, [persistTodos]);

  const deleteTodo = useCallback((id) => {
    setTodos(prev => {
      const next = prev.filter(t => t.id !== id);
      persistTodos(next);
      return next;
    });
  }, [persistTodos]);

  const clearDoneTodos = useCallback(() => {
    setTodos(prev => {
      const next = prev.filter(t => !t.done);
      persistTodos(next);
      return next;
    });
  }, [persistTodos]);

  // Finds the closest matching pending todo for voice/text commands like "mark X done"
  const findTodoByText = useCallback((query) => {
    const q = query.trim().toLowerCase();
    return todos.find(t => !t.done && t.text.toLowerCase().includes(q)) ||
      todos.find(t => t.text.toLowerCase().includes(q));
  }, [todos]);

  const addTimer = useCallback((label, ms, type) => {
    if (window.Notification && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch {}
    }
    setTimers(prev => {
      const next = [...prev, { id: Date.now() + Math.random(), label, type, endTime: Date.now() + ms }];
      persistTimers(next);
      return next;
    });
  }, [persistTimers]);

  // Checked every second (piggybacking on the live clock tick) for anything that's come due
  useEffect(() => {
    setTimers(prev => {
      const now = Date.now();
      const due = prev.filter(t => t.endTime <= now);
      if (!due.length) return prev;
      const remaining = prev.filter(t => t.endTime > now);
      due.forEach(t => {
        playBeep();
        const label = t.type === 'reminder' ? `Reminder: ${t.label}` : `Timer done: ${t.label}`;
        setMessages(m => [...m, { role: 'bot', skill: true, text: `⏰ ${label}` }]);
        speakEcko(label);
        if (window.Notification && Notification.permission === 'granted') {
          try { new Notification('Ecko', { body: label }); } catch {}
        }
      });
      persistTimers(remaining);
      return remaining;
    });
  }, [liveClock, persistTimers]);

  // Live weather — once you've asked about a city, keep it fresh in the background
  const fetchWeatherFor = useCallback(async (lat, lon) => {
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      return data.current_weather || null;
    } catch {
      return null;
    }
  }, []);

  const trackLiveWeather = useCallback((loc) => {
    if (weatherIntervalRef.current) clearInterval(weatherIntervalRef.current);
    const refresh = async () => {
      const cw = await fetchWeatherFor(loc.lat, loc.lon);
      if (cw) {
        setLiveWeather({ ...loc, temp: cw.temperature, wind: cw.windspeed, updatedAt: new Date() });
      }
    };
    refresh();
    weatherIntervalRef.current = setInterval(refresh, 5 * 60 * 1000); // every 5 minutes
  }, [fetchWeatherFor]);

  useEffect(() => {
    return () => { if (weatherIntervalRef.current) clearInterval(weatherIntervalRef.current); };
  }, []);

  const saveMemory = useCallback(async (next) => {
    setMemory(next);
    try {
      await storage.set('ecko-memory', JSON.stringify(next));
    } catch {
      // storage failed silently — memory just won't persist this session
    }
  }, []);

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [messages]);

  useEffect(() => {
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (audioStreamRef.current) audioStreamRef.current.getTracks().forEach(t => t.stop());
      if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch {} }
    };
  }, []);

  useEffect(() => {
    if (rootRef.current) {
      rootRef.current.classList.toggle('thinking', busy || booting || songBusy);
      rootRef.current.classList.toggle('listening', listening || songRecording);
    }
  }, [busy, listening, booting, songBusy, songRecording]);

  const speak = useCallback((text) => {
    if (!voiceOn) return;
    speakEcko(text);
  }, [voiceOn]);

  const sendMessage = useCallback(async (text) => {
    const trimmed = text.trim();
    if (!trimmed || busy || booting) return;
    setMessages(m => [...m, { role: 'user', text: trimmed }]);
    setInput('');
    setBusy(true);

    // Memory skills — checked first since they need access to stored state
    if (/^(open|launch|start)\s+(the\s+)?photo\s*lab$|^edit a photo$/i.test(trimmed)) {
      const reply = "Opening Photo Lab.";
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      setPhotoMode(true);
      return;
    }

    if (isListTimersRequest(trimmed)) {
      let reply;
      if (!timers.length) {
        reply = "You don't have any timers or reminders running.";
      } else {
        const parts = timers.map(t =>
          `${t.type === 'reminder' ? 'reminder to ' + t.label : t.label} (${formatRemaining(t.endTime - Date.now())} left)`
        );
        reply = `You have ${timers.length} running: ${parts.join('; ')}.`;
      }
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    if (isCancelTimersRequest(trimmed)) {
      const count = timers.length;
      setTimers([]);
      persistTimers([]);
      const reply = count ? `Cancelled ${count} timer${count > 1 ? 's' : ''}.` : "There was nothing to cancel.";
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const timerReq = matchTimerRequest(trimmed);
    if (timerReq) {
      addTimer(timerReq.label, timerReq.ms, 'timer');
      const reply = `Timer set for ${formatRemaining(timerReq.ms)}.`;
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const reminderReq = matchReminderRequest(trimmed);
    if (reminderReq) {
      addTimer(reminderReq.label, reminderReq.ms, 'reminder');
      const reply = `Got it — I'll remind you to ${reminderReq.label} in ${formatRemaining(reminderReq.ms)}.`;
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    if (/^(open|show)\s+(my\s+)?(to-?do\s+)?list$/i.test(trimmed)) {
      const reply = "Opening your to-do list.";
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      setTodoMode(true);
      return;
    }

    const addTodoText = matchAddTodo(trimmed);
    if (addTodoText) {
      addTodo(addTodoText);
      const reply = `Added "${addTodoText}" to your list.`;
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    if (isListTodosRequest(trimmed)) {
      const pending = todos.filter(t => !t.done);
      const reply = pending.length
        ? `You have ${pending.length} task${pending.length > 1 ? 's' : ''}: ${pending.map(t => t.text).join('; ')}.`
        : "Your to-do list is empty.";
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const completeText = matchCompleteTodo(trimmed);
    if (completeText) {
      const match = findTodoByText(completeText);
      const reply = match ? `Marked "${match.text}" as done.` : `I couldn't find "${completeText}" on your list.`;
      if (match) toggleTodo(match.id);
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const deleteText = matchDeleteTodo(trimmed);
    if (deleteText) {
      const match = findTodoByText(deleteText);
      const reply = match ? `Removed "${match.text}" from your list.` : `I couldn't find "${deleteText}" on your list.`;
      if (match) deleteTodo(match.id);
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    if (isClearTodosRequest(trimmed)) {
      clearDoneTodos();
      const reply = "Cleared your completed tasks.";
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const forgetHit = isForgetRequest(trimmed);
    if (forgetHit) {
      await saveMemory({ name: null, facts: [] });
      const reply = "Done — I've cleared everything I knew about you.";
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const nameHit = matchName(trimmed);
    if (nameHit) {
      const next = { ...memoryRef.current, name: nameHit };
      await saveMemory(next);
      const reply = `Good to meet you, ${nameHit}. I'll remember that.`;
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const recallHit = isRecallRequest(trimmed);
    if (recallHit) {
      const { name, facts } = memoryRef.current;
      let reply;
      if (!name && facts.length === 0) {
        reply = "I don't have anything stored about you yet.";
      } else {
        const parts = [];
        if (name) parts.push(`your name is ${name}`);
        if (facts.length) parts.push(...facts);
        reply = `Here's what I know: ${parts.join('; ')}.`;
      }
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const rememberHit = matchRemember(trimmed);
    if (rememberHit) {
      const next = { ...memoryRef.current, facts: [...memoryRef.current.facts, rememberHit] };
      await saveMemory(next);
      const reply = `Got it. I'll remember that ${rememberHit}.`;
      setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
      speak(reply);
      setBusy(false);
      return;
    }

    const skillHit = await runSkills(trimmed);
    if (skillHit) {
      setMessages(m => [...m, { role: 'bot', skill: true, text: skillHit.reply, map: skillHit.map, photo: skillHit.photo }]);
      speak(skillHit.reply);
      if (skillHit.weather) trackLiveWeather(skillHit.weather);
      setBusy(false);
      return;
    }

    try {
      const history = messages
        .filter(m => m.role === 'user' || m.role === 'bot')
        .map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));

      const { name, facts } = memoryRef.current;
      const memoryNote = (name || facts.length)
        ? ` What you know about the user — ${name ? `their name is ${name}. ` : ''}${facts.join('. ')}`.trim()
        : '';

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          system: "You are Ecko, a personal AI assistant in the spirit of Jarvis from Iron Man: composed, precise, and quietly confident. Address the user directly and speak like a capable aide, not a chatbot — no emoji, no exclamation points, no filler enthusiasm ('Great question!', 'I'd be happy to!'). Keep replies tight — a few sentences unless real detail is asked for. You're allowed occasional dry, understated wit, but competence comes first: give the useful answer plainly, and let any humor be a small aside, never the point. You have live web search — use it for current events, recent facts, or anything that could have changed since your training, rather than guessing. Don't mention the search mechanics out loud, just answer with what you found." + memoryNote,
          messages: [...history, { role: 'user', content: trimmed }],
          tools: [{ type: "web_search_20250305", name: "web_search" }]
        })
      });
      const data = await response.json();
      const reply = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n') || "I didn't catch that clearly.";
      const usedSearch = (data.content || []).some(
        b => b.type === 'server_tool_use' || b.type === 'web_search_tool_result'
      );
      setMessages(m => [...m, { role: 'bot', text: reply, searched: usedSearch }]);
      speak(reply);
    } catch (err) {
      setMessages(m => [...m, { role: 'bot', text: "Connection issue — try again in a moment." }]);
    } finally {
      setBusy(false);
    }
  }, [messages, busy, booting, speak, saveMemory, trackLiveWeather, timers, addTimer, persistTimers, todos, addTodo, toggleTodo, deleteTodo, clearDoneTodos, findTodoByText]);

  // --- Wake word ("Hey Ecko") ---
  const [wakeOn, setWakeOn] = useState(false);
  const wakeOnRef = useRef(false);
  const wakeRecRef = useRef(null);

  useEffect(() => { wakeOnRef.current = wakeOn; }, [wakeOn]);

  const createWakeRecognition = useCallback(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      const transcript = last[0].transcript.toLowerCase();
      if (/\b(hey|hi|ok)?\s*ecko\b/.test(transcript)) {
        try { rec.onend = null; rec.stop(); } catch {}
        beginCommandCapture();
      }
    };
    rec.onend = () => {
      // Browsers auto-stop background listening after a pause — restart while wake mode is on.
      if (wakeOnRef.current) {
        setTimeout(() => {
          if (wakeOnRef.current) {
            wakeRecRef.current = createWakeRecognition();
            wakeRecRef.current && wakeRecRef.current.start();
          }
        }, 250);
      }
    };
    rec.onerror = () => {};
    return rec;
  }, []);

  const beginCommandCapture = useCallback(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      sendMessage(transcript);
    };
    rec.onend = () => {
      setListening(false);
      stopWaveform();
      if (wakeOnRef.current) {
        wakeRecRef.current = createWakeRecognition();
        wakeRecRef.current && wakeRecRef.current.start();
      }
    };
    rec.onerror = () => { setListening(false); stopWaveform(); };
    recognitionRef.current = rec;
    rec.start();
    setListening(true);
    startWaveform();
  }, [createWakeRecognition, sendMessage, startWaveform, stopWaveform]);

  // --- Voice-reactive waveform (real mic volume, not decorative) ---
  const [waveBars, setWaveBars] = useState(new Array(12).fill(0.06));
  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);
  const audioStreamRef = useRef(null);
  const rafRef = useRef(null);

  const startWaveform = useCallback(() => {
    navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
      audioStreamRef.current = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const source = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.75;
      source.connect(analyser);
      audioCtxRef.current = ctx;
      analyserRef.current = analyser;
      const data = new Uint8Array(analyser.frequencyBinCount);

      const tick = () => {
        if (!analyserRef.current) return;
        analyser.getByteFrequencyData(data);
        const bars = Array.from(data).slice(0, 12).map(v => Math.max(0.06, v / 255));
        setWaveBars(bars);
        rafRef.current = requestAnimationFrame(tick);
      };
      tick();
    }).catch(() => {
      // mic access denied or unavailable — the SVG core still animates, just no live waveform
    });
  }, []);

  const stopWaveform = useCallback(() => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
    analyserRef.current = null;
    if (audioStreamRef.current) audioStreamRef.current.getTracks().forEach(t => t.stop());
    audioStreamRef.current = null;
    if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch {} }
    audioCtxRef.current = null;
    setWaveBars(new Array(12).fill(0.06));
  }, []);

  const identifySong = useCallback(() => {
    if (!auddToken) {
      setMessages(m => [...m, { role: 'bot', text: "I need a free AudD token first — paste it in the Song ID box below, then try again." }]);
      return;
    }
    if (songRecording || songBusy) return;

    navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
      const recorder = new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        stopWaveform();
        setSongRecording(false);
        setSongBusy(true);
        try {
          const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
          const form = new FormData();
          form.append('file', blob, 'clip.webm');
          form.append('api_token', auddToken);
          const res = await fetch('https://api.audd.io/', { method: 'POST', body: form });
          const data = await res.json();
          let reply;
          if (data.status === 'success' && data.result) {
            const { title, artist, album } = data.result;
            reply = `That's "${title}" by ${artist}${album ? ` — from ${album}` : ''}.`;
          } else {
            reply = "I couldn't identify that — try getting closer to the source with less background noise.";
          }
          setMessages(m => [...m, { role: 'bot', skill: true, text: reply }]);
          speakEcko(reply);
        } catch {
          setMessages(m => [...m, { role: 'bot', skill: true, text: "Song lookup failed — connection issue." }]);
        } finally {
          setSongBusy(false);
        }
      };
      recorder.start();
      setSongRecording(true);
      startWaveform();
      setTimeout(() => { if (recorder.state !== 'inactive') recorder.stop(); }, 7000);
    }).catch(() => {
      setMessages(m => [...m, { role: 'bot', text: "I need microphone access to identify songs." }]);
    });
  }, [auddToken, songRecording, songBusy, startWaveform, stopWaveform]);

  const toggleWake = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMessages(m => [...m, { role: 'bot', text: "Wake word needs Chrome's speech recognition — not supported here." }]);
      return;
    }
    if (wakeOn) {
      setWakeOn(false);
      wakeOnRef.current = false;
      if (wakeRecRef.current) { try { wakeRecRef.current.onend = null; wakeRecRef.current.stop(); } catch {} }
      setMessages(m => [...m, { role: 'bot', skill: true, text: "Wake mode off." }]);
    } else {
      setWakeOn(true);
      wakeOnRef.current = true;
      wakeRecRef.current = createWakeRecognition();
      wakeRecRef.current && wakeRecRef.current.start();
      setMessages(m => [...m, { role: 'bot', skill: true, text: `Wake mode on — say "Hey Ecko" any time.` }]);
    }
  };

  const toggleMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMessages(m => [...m, { role: 'bot', text: "Voice input isn't supported in this browser. Try Chrome." }]);
      return;
    }
    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      setListening(false);
      stopWaveform();
      return;
    }
    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      sendMessage(transcript);
    };
    rec.onend = () => { setListening(false); stopWaveform(); };
    rec.onerror = () => { setListening(false); stopWaveform(); };
    recognitionRef.current = rec;
    rec.start();
    setListening(true);
    startWaveform();
  };

  if (photoMode) {
    return <PhotoLab onClose={() => setPhotoMode(false)} />;
  }

  if (todoMode) {
    return (
      <TodoPanel
        todos={todos}
        onAdd={addTodo}
        onToggle={toggleTodo}
        onDelete={deleteTodo}
        onClearDone={clearDoneTodos}
        onClose={() => setTodoMode(false)}
      />
    );
  }

  return (
    <div id="ecko-root" ref={rootRef}>
      <div className="ecko-header">
        <div className="ecko-brand">E<span>C</span>KO</div>
        <div className="ecko-status">
          {(memory.name || memory.facts.length > 0) && (
            <span className="ecko-mem-badge">{(memory.name ? 1 : 0) + memory.facts.length} STORED ·</span>
          )}
          <span className={`ecko-dot ${busy || listening || booting || songRecording || songBusy ? 'active' : wakeOn ? 'armed' : ''}`}></span>
          {booting ? 'BOOTING' : songRecording ? 'LISTENING FOR SONG' : songBusy ? 'IDENTIFYING...' : listening ? 'LISTENING' : busy ? 'PROCESSING' : wakeOn ? "ARMED · SAY 'HEY ECKO'" : 'STANDBY'}
          <button className="ecko-lock-btn" onClick={onLock} title="Lock Ecko">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </button>
        </div>
      </div>

      <div className="ecko-core-wrap"><CoreVisualizer /></div>
      <WaveformBars bars={waveBars} active={listening || songRecording} />

      <div className="ecko-live">
        <span className="ecko-live-clock">
          {liveClock.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
        </span>
        {liveWeather && (
          <span className="ecko-live-weather">
            {liveWeather.name} {liveWeather.temp}°C
          </span>
        )}
        {timers.slice(0, 2).map(t => (
          <span key={t.id} className="ecko-live-timer">
            {t.type === 'reminder' ? '🔔' : '⏱'} {formatRemaining(t.endTime - liveClock.getTime())}
          </span>
        ))}
      </div>

      <div className="ecko-log" ref={logRef}>
        {messages.map((m, i) => (
          <div key={i} className={`ecko-msg ${m.role} ${m.skill ? 'skill' : ''}`}>
            {m.role !== 'system' && (
              <div className="ecko-msg-label">
                {m.role === 'user' ? 'YOU' : m.skill ? 'ECKO · SKILL' : m.searched ? 'ECKO · WEB' : 'ECKO'}
              </div>
            )}
            <div className="ecko-bubble">{m.text}</div>
            {m.map && (
              <iframe
                className="ecko-map"
                loading="lazy"
                title="location map"
                src={`https://www.openstreetmap.org/export/embed.html?bbox=${m.map.lon - 0.06}%2C${m.map.lat - 0.035}%2C${m.map.lon + 0.06}%2C${m.map.lat + 0.035}&layer=mapnik&marker=${m.map.lat}%2C${m.map.lon}`}
              />
            )}
            {m.photo && (
              <img className="ecko-photo" src={m.photo.url} alt={m.photo.title} loading="lazy" />
            )}
          </div>
        ))}
      </div>

      {!auddToken && (
        <div className="ecko-voicepicker">
          <input
            className="pl-text-input"
            style={{ maxWidth: 260 }}
            value={auddInput}
            placeholder="Paste free AudD token for Song ID..."
            onChange={e => setAuddInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') saveAuddToken(); }}
          />
          <button onClick={saveAuddToken}>Save</button>
        </div>
      )}

      {voiceList.length > 0 && (
        <div className="ecko-voicepicker">
          <select
            value={voiceURI}
            onChange={e => chooseVoice(e.target.value)}
          >
            <option value="">Auto (best guess)</option>
            {voiceList.map(v => (
              <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>
            ))}
          </select>
          <button onClick={() => speakEcko("This is what I sound like. Systems nominal.")}>Test</button>
        </div>
      )}

      <div className="ecko-hint">{voiceOn ? 'VOICE OUTPUT ON — tap speaker to mute' : 'VOICE OUTPUT MUTED'}</div>

      <div className="ecko-inputbar">
        <button className="ecko-btn" onClick={() => setTodoMode(true)} title="To-Do List">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/></svg>
        </button>
        <button className="ecko-btn" onClick={() => setPhotoMode(true)} title="Photo Lab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <div className="ecko-btn-wrap">
          <button className={`ecko-btn ${songRecording ? 'mic-on' : ''}`} onClick={identifySong} disabled={songBusy} title="Identify a song playing nearby">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </button>
          <button
            className="ecko-info-badge"
            title="How Song ID works"
            onClick={() => setMessages(m => [...m, {
              role: 'bot',
              skill: true,
              text: "Song ID: tap the music-note button while a song is playing nearby. Ecko records 7 seconds of audio through your mic, sends it to AudD (a free song-recognition service) to match it, then tells you the title and artist. It needs a free AudD token saved first (see the box above), mic permission, and works best close to the speaker with minimal background noise."
            }])}
          >i</button>
        </div>
        <button className={`ecko-btn ${wakeOn ? 'wake-on' : ''}`} onClick={toggleWake} title="Toggle wake word ('Hey Ecko')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M6 12a6 6 0 0 1 12 0"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg>
        </button>
        <button className="ecko-btn" onClick={() => setVoiceOn(v => !v)} title="Toggle voice output">
          {voiceOn ? (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>
          ) : (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="16" y1="9" x2="21" y2="14"/><line x1="21" y1="9" x2="16" y2="14"/></svg>
          )}
        </button>
        <input
          className="ecko-input"
          value={input}
          disabled={booting || busy}
          placeholder={booting ? "Ecko is starting up..." : busy ? "Ecko is thinking..." : "Ask Ecko anything..."}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') sendMessage(input); }}
        />
        <button className={`ecko-btn ${listening ? 'mic-on' : ''}`} onClick={toggleMic} disabled={wakeOn} style={wakeOn ? { opacity: 0.35, cursor: 'not-allowed' } : {}} title={wakeOn ? "Mic is driven by wake mode" : "Voice input"}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button
          className="ecko-btn send"
          onClick={() => sendMessage(input)}
          disabled={busy || booting || !input.trim()}
          style={(busy || booting || !input.trim()) ? { opacity: 0.35, cursor: 'not-allowed' } : {}}
          title="Send"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('ecko-root')).render(<App />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
